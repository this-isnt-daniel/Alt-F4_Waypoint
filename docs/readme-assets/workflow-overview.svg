<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430" role="img" aria-labelledby="title desc">
  <title id="title">Waypoint end-to-end workflow</title>
  <desc id="desc">Order confirmation flows through dispatcher planning, loader verification, driver delivery, and receipt confirmation.</desc>
  <style>
    .bg { fill: #f8fbf9; }
    .lane { fill: #ffffff; stroke: #d9e4df; stroke-width: 1.4; }
    .box { fill: #073b2f; stroke: #0f6b52; stroke-width: 1.6; rx: 12; }
    .box2 { fill: #0f766e; stroke: #115e59; stroke-width: 1.6; rx: 12; }
    .box3 { fill: #14532d; stroke: #166534; stroke-width: 1.6; rx: 12; }
    .text { fill: #ecfdf5; font: 700 18px Arial, sans-serif; }
    .small { fill: #d1fae5; font: 500 13px Arial, sans-serif; }
    .title { fill: #0b2019; font: 800 26px Arial, sans-serif; }
    .label { fill: #334155; font: 700 14px Arial, sans-serif; }
    .arrow { stroke: #64748b; stroke-width: 2.4; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1180" height="430"/>
  <text class="title" x="40" y="46">Waypoint operational workflow</text>
  <rect class="lane" x="40" y="78" width="1100" height="288" rx="16"/>
  <text class="label" x="78" y="116">1. Store Manager</text>
  <text class="label" x="302" y="116">2. Dispatcher</text>
  <text class="label" x="526" y="116">3. Loader</text>
  <text class="label" x="750" y="116">4. Driver</text>
  <text class="label" x="974" y="116">5. Store Manager</text>

  <rect class="box" x="66" y="145" width="170" height="82" rx="12"/>
  <text class="text" x="96" y="178">Confirm</text>
  <text class="text" x="104" y="201">Order</text>
  <text class="small" x="86" y="245">draft -> confirmed</text>

  <rect class="box2" x="290" y="145" width="170" height="82" rx="12"/>
  <text class="text" x="321" y="178">Generate</text>
  <text class="text" x="333" y="201">Plan</text>
  <text class="small" x="310" y="245">optimizer + approve</text>

  <rect class="box" x="514" y="145" width="170" height="82" rx="12"/>
  <text class="text" x="548" y="178">Verify</text>
  <text class="text" x="545" y="201">Manifest</text>
  <text class="small" x="536" y="245">line item checks</text>

  <rect class="box3" x="738" y="145" width="170" height="82" rx="12"/>
  <text class="text" x="765" y="178">Deliver</text>
  <text class="text" x="770" y="201">Trip</text>
  <text class="small" x="756" y="245">events + POD</text>

  <rect class="box2" x="962" y="145" width="170" height="82" rx="12"/>
  <text class="text" x="995" y="178">Confirm</text>
  <text class="text" x="1000" y="201">Receipt</text>
  <text class="small" x="984" y="245">close order loop</text>

  <path class="arrow" d="M236 186 H286"/>
  <path class="arrow" d="M460 186 H510"/>
  <path class="arrow" d="M684 186 H734"/>
  <path class="arrow" d="M908 186 H958"/>

  <rect class="lane" x="66" y="290" width="1066" height="44" rx="10"/>
  <text class="label" x="90" y="318">Audit layer:</text>
  <text x="178" y="318" fill="#475569" font="500 14px Arial, sans-serif">delivery_events, driver_events, load checks, discrepancies, urgency requests, incidents, route changes</text>
</svg>
