<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">Waypoint service map</title>
  <desc id="desc">Frontend portals connect to FastAPI routers, service modules, optimizer, and PostgreSQL.</desc>
  <style>
    .bg { fill: #ffffff; }
    .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.3; rx: 16; }
    .frontend { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.4; rx: 10; }
    .api { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.4; rx: 10; }
    .svc { fill: #fff7ed; stroke: #f97316; stroke-width: 1.4; rx: 10; }
    .db { fill: #f1f5f9; stroke: #475569; stroke-width: 1.4; rx: 10; }
    .engine { fill: #f0fdfa; stroke: #14b8a6; stroke-width: 1.4; rx: 10; }
    .title { fill: #0f172a; font: 800 26px Arial, sans-serif; }
    .h { fill: #0f172a; font: 800 16px Arial, sans-serif; }
    .t { fill: #1e293b; font: 700 14px Arial, sans-serif; }
    .s { fill: #475569; font: 500 12px Arial, sans-serif; }
    .line { stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1180" height="520"/>
  <text class="title" x="40" y="44">Service map</text>

  <rect class="group" x="40" y="72" width="220" height="380" rx="16"/>
  <text class="h" x="70" y="106">Frontend portals</text>
  <rect class="frontend" x="70" y="130" width="160" height="42" rx="10"/><text class="t" x="101" y="157">Central</text>
  <rect class="frontend" x="70" y="188" width="160" height="42" rx="10"/><text class="t" x="86" y="215">Store Manager</text>
  <rect class="frontend" x="70" y="246" width="160" height="42" rx="10"/><text class="t" x="94" y="273">Dispatcher</text>
  <rect class="frontend" x="70" y="304" width="160" height="42" rx="10"/><text class="t" x="112" y="331">Loader</text>
  <rect class="frontend" x="70" y="362" width="160" height="42" rx="10"/><text class="t" x="114" y="389">Driver</text>

  <rect class="group" x="330" y="72" width="230" height="380" rx="16"/>
  <text class="h" x="365" y="106">FastAPI routers</text>
  <rect class="api" x="360" y="130" width="170" height="42" rx="10"/><text class="t" x="414" y="157">Auth</text>
  <rect class="api" x="360" y="188" width="170" height="42" rx="10"/><text class="t" x="407" y="215">Orders</text>
  <rect class="api" x="360" y="246" width="170" height="42" rx="10"/><text class="t" x="392" y="273">Dispatcher</text>
  <rect class="api" x="360" y="304" width="170" height="42" rx="10"/><text class="t" x="407" y="331">Loader</text>
  <rect class="api" x="360" y="362" width="170" height="42" rx="10"/><text class="t" x="410" y="389">Driver</text>

  <rect class="group" x="630" y="72" width="230" height="380" rx="16"/>
  <text class="h" x="665" y="106">Service layer</text>
  <rect class="svc" x="660" y="130" width="170" height="42" rx="10"/><text class="t" x="699" y="157">Order svc</text>
  <rect class="svc" x="660" y="188" width="170" height="42" rx="10"/><text class="t" x="686" y="215">Planning svc</text>
  <rect class="svc" x="660" y="246" width="170" height="42" rx="10"/><text class="t" x="697" y="273">Loader svc</text>
  <rect class="svc" x="660" y="304" width="170" height="42" rx="10"/><text class="t" x="700" y="331">Driver svc</text>
  <rect class="svc" x="660" y="362" width="170" height="42" rx="10"/><text class="t" x="683" y="389">Recovery svc</text>

  <rect class="group" x="930" y="72" width="210" height="380" rx="16"/>
  <text class="h" x="975" y="106">Shared core</text>
  <rect class="engine" x="960" y="140" width="150" height="64" rx="10"/><text class="t" x="996" y="166">Optimizer</text><text class="s" x="980" y="186">greedy + CP-SAT</text>
  <rect class="db" x="960" y="242" width="150" height="64" rx="10"/><text class="t" x="1001" y="268">Postgres</text><text class="s" x="982" y="288">canonical state</text>
  <rect class="db" x="960" y="344" width="150" height="64" rx="10"/><text class="t" x="1002" y="370">Ledger</text><text class="s" x="980" y="390">audit + sync</text>

  <path class="line" d="M230 267 H356"/>
  <path class="line" d="M530 267 H656"/>
  <path class="line" d="M830 209 H956"/>
  <path class="line" d="M830 287 H956"/>
  <path class="line" d="M830 367 H956"/>
</svg>
