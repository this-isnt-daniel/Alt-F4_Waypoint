
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waypoint-optimizer"
version = "0.1.0"
description = "Fleet-allocation optimization engine for Tech-Triathlon 2026 Waypoint challenge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Waypoint Team" }]

dependencies = [
    "ortools>=9.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
data = [
    "pandas>=2.0",
]

[project.scripts]
waypoint-optimizer = "waypoint_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
