<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.osm.org https://*.basemaps.cartocdn.com https://*.cartocdn.com;
               font-src 'self' data:;
               connect-src 'self' ws: wss: http://localhost:* http://127.0.0.1:* https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://*.cartocdn.com;
               frame-ancestors 'none';
               base-uri 'self';
               form-action 'self';"
    />
    <title>Waypoint Driver</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("waypoint.driver.theme");
          if (theme !== "light" && theme !== "dark") theme = "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_error) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
