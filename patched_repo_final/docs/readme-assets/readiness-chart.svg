<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Submission readiness chart</title>
  <desc id="desc">A bar chart showing completed, partial, and missing README-related submission items.</desc>
  <style>
    .bg { fill: #ffffff; }
    .title { fill: #0f172a; font: 800 25px Arial, sans-serif; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; }
    .label { fill: #334155; font: 700 13px Arial, sans-serif; }
    .tick { fill: #64748b; font: 500 11px Arial, sans-serif; }
    .done { fill: #10b981; }
    .partial { fill: #f59e0b; }
    .missing { fill: #ef4444; }
    .note { fill: #475569; font: 500 12px Arial, sans-serif; }
  </style>
  <rect class="bg" width="980" height="360"/>
  <text class="title" x="38" y="42">README and submission readiness</text>
  <line class="axis" x1="260" y1="300" x2="900" y2="300"/>
  <line class="axis" x1="260" y1="82" x2="260" y2="300"/>
  <text class="tick" x="260" y="322">0</text>
  <text class="tick" x="416" y="322">25</text>
  <text class="tick" x="576" y="322">50</text>
  <text class="tick" x="736" y="322">75</text>
  <text class="tick" x="886" y="322">100</text>

  <text class="label" x="38" y="106">README structure</text>
  <rect class="done" x="260" y="88" width="608" height="24" rx="5"/>
  <text class="tick" x="878" y="106">95%</text>

  <text class="label" x="38" y="146">Docs folder present</text>
  <rect class="done" x="260" y="128" width="576" height="24" rx="5"/>
  <text class="tick" x="846" y="146">90%</text>

  <text class="label" x="38" y="186">Architecture/data docs</text>
  <rect class="partial" x="260" y="168" width="384" height="24" rx="5"/>
  <text class="tick" x="654" y="186">60%</text>

  <text class="label" x="38" y="226">Docker full stack</text>
  <rect class="missing" x="260" y="208" width="128" height="24" rx="5"/>
  <text class="tick" x="398" y="226">20%</text>

  <text class="label" x="38" y="266">Runtime screenshots</text>
  <rect class="missing" x="260" y="248" width="96" height="24" rx="5"/>
  <text class="tick" x="366" y="266">15%</text>

  <circle class="done" cx="680" cy="342" r="6"/><text class="note" x="692" y="346">done</text>
  <circle class="partial" cx="748" cy="342" r="6"/><text class="note" x="760" y="346">partial</text>
  <circle class="missing" cx="830" cy="342" r="6"/><text class="note" x="842" y="346">needs work</text>
</svg>
